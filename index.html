<!DOCTYPE html>
<html>
<head>
  <title>Auto Click Button</title>
</head>
<body>

<button id="myButton" onclick="hello()">
  Click Me
</button>

<script>
function hello() {
  alert("Button clicked automatically!");
}

// auto click after 2 seconds
setTimeout(() => {
  document.getElementById("myButton").click();
}, 2000);
</script>

</body>
</html>
